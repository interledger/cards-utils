name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -cover ./...
      - run: go vet ./...
      # Decode compares lengths that do not fit a 32-bit int. The race
      # detector does not support 386.
      - run: GOARCH=386 go test ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./tlv -run='^$' -fuzz='^FuzzDecode$' -fuzztime=60s
      - run: go test ./tlv -run='^$' -fuzz='^FuzzEncode$' -fuzztime=30s
      - run: go test ./tlv -run='^$' -fuzz='^FuzzValidateAmount$' -fuzztime=30s
      # A failing input is written to tlv/testdata/fuzz. Keep it, so it can
      # be committed as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: tlv/testdata/fuzz

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
